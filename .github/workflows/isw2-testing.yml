name: ISW2 Project Tests

on:
  push:
    branches:
      - isw2-project
  pull_request:
    branches:
      - isw2-project
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: isw2-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  project-tests:
    name: ISW2 testing harness - Java 21
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'
          cache: maven
          cache-dependency-path: isw2/testing/pom.xml

      - name: Show Java and Maven versions
        run: |
          java -version
          mvn -version

      - name: Run ISW2 project regression
        run: >
          mvn -B
          -f isw2/testing/pom.xml
          -Dsurefire.excludes="**/PCEnhancerBlackBoxInvalidOptionsTest.java"
          test

      - name: Verify documented TBB-026 baseline failure
        shell: bash
        run: |
          set +e

          mvn -B \
            -f isw2/testing/pom.xml \
            -Dtest=PCEnhancerBlackBoxInvalidOptionsTest \
            test

          exit_code=$?
          set -e

          report="isw2/testing/target/surefire-reports/TEST-it.uniroma2.isw2.openjpa.testing.pcenhancer.bb.PCEnhancerBlackBoxInvalidOptionsTest.xml"

          if [ "$exit_code" -eq 0 ]; then
            echo "::error::TBB-026 unexpectedly passed. Review the documented OpenJPA 4.1.1 baseline behaviour."
            exit 1
          fi

          if [ ! -f "$report" ]; then
            echo "::error::TBB-026 did not produce a Surefire report; Maven may have failed for an infrastructure reason."
            exit 1
          fi

          if ! grep -q '<failure' "$report"; then
            echo "::error::TBB-026 Maven execution failed, but not because of the expected JUnit assertion failure."
            exit 1
          fi

          echo "TBB-026 reproduced the documented expected failure."

  evosuite-tests:
    name: EvoSuite T_ES - Java 11
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '11'
          cache: maven
          cache-dependency-path: isw2/testing/pom.xml

      - name: Show Java and Maven versions
        shell: pwsh
        run: |
          java -version
          javac -version
          mvn -version

      - name: Validate frozen T_ES cardinalities
        shell: pwsh
        run: |
          function Count-Tests([string]$path) {
            if (-not (Test-Path $path)) {
              throw "Frozen EvoSuite source not found: $path"
            }

            $count = 0
            $matches = @(Select-String -Path $path -Pattern "@Test" -AllMatches)

            foreach ($match in $matches) {
              $count += $match.Matches.Count
            }

            return $count
          }

          $pcSeed0 = "isw2/testing/src/test/java/it/uniroma2/isw2/openjpa/testing/pcenhancer/es/PCEnhancerEvoSuiteSeed0Test.java"
          $pcSeed1 = "isw2/testing/src/test/java/it/uniroma2/isw2/openjpa/testing/pcenhancer/es/PCEnhancerEvoSuiteSeed1Test.java"

          $liwSeed0 = "isw2/testing/src/test/java/it/uniroma2/isw2/openjpa/testing/listiteratorwrapper/es/ListIteratorWrapperEvoSuiteSeed0Test.java"

          $pcSeed0Count = Count-Tests $pcSeed0
          $pcSeed1Count = Count-Tests $pcSeed1
          $pcTotal = $pcSeed0Count + $pcSeed1Count

          $liwTotal = Count-Tests $liwSeed0

          Write-Host "PCEnhancer seed 0       : $pcSeed0Count"
          Write-Host "PCEnhancer seed 1       : $pcSeed1Count"
          Write-Host "PCEnhancer total        : $pcTotal"
          Write-Host "ListIteratorWrapper     : $liwTotal"

          if (
            $pcSeed0Count -ne 15 -or
            $pcSeed1Count -ne 15 -or
            $pcTotal -ne 30
          ) {
            throw "Frozen PCEnhancer T_ES cardinality mismatch. Expected 15 + 15 = 30."
          }

          if ($liwTotal -ne 12) {
            throw "Frozen ListIteratorWrapper T_ES cardinality mismatch. Expected 12."
          }

          Write-Host ""
          Write-Host "Frozen cardinalities: PASS"

      - name: Prepare isolated EvoSuite Java 11 harness
        shell: pwsh
        run: |
          $testing = Join-Path $env:GITHUB_WORKSPACE "isw2\testing"

          $depsDir = Join-Path $testing "target\ci-evosuite-deps"
          $outDir = Join-Path $testing "target\ci-evosuite-test-classes"

          New-Item -ItemType Directory -Force $depsDir | Out-Null
          New-Item -ItemType Directory -Force $outDir | Out-Null

          # PCEnhancer frozen scaffolding paths.
          New-Item -ItemType Directory -Force `
            "C:\ISW2\openjpa\isw2\testing\target\evosuite-pcenhancer\canonical-seed-0" |
            Out-Null

          New-Item -ItemType Directory -Force `
            "C:\ISW2\openjpa\isw2\testing\target\evosuite-pcenhancer\canonical-seed-1" |
            Out-Null

          # ListIteratorWrapper frozen scaffolding path.
          New-Item -ItemType Directory -Force `
            "C:\ISW2\openjpa\isw2\testing\target\evosuite-listiteratorwrapper\canonical-seed-0" |
            Out-Null

          # Path recorded by the frozen EvoSuite scaffoldings.
          New-Item -ItemType Directory -Force `
            "C:\Users\marco\AppData\Local\Temp" |
            Out-Null

      - name: Resolve isolated T_ES dependencies
        shell: pwsh
        run: |
          $testing = Join-Path $env:GITHUB_WORKSPACE "isw2\testing"
          $depsDir = Join-Path $testing "target\ci-evosuite-deps"

          mvn -B `
            -f isw2/testing/pom.xml `
            dependency:copy-dependencies `
            "-DincludeScope=test" `
            "-DoutputDirectory=$depsDir"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to copy the ISW2 harness dependencies."
          }

          mvn -B `
            -f isw2/testing/pom.xml `
            dependency:copy `
            "-Dartifact=junit:junit:4.13.2" `
            "-DoutputDirectory=$depsDir"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve JUnit 4.13.2."
          }

          mvn -B `
            -f isw2/testing/pom.xml `
            dependency:copy `
            "-Dartifact=org.hamcrest:hamcrest-core:1.3" `
            "-DoutputDirectory=$depsDir"

          if ($LASTEXITCODE -ne 0) {
            throw "Unable to resolve Hamcrest 1.3."
          }

          $runtimeJar = Join-Path `
            $depsDir `
            "evosuite-standalone-runtime-1.2.0.jar"

          $runtimeUrl = `
            "https://github.com/EvoSuite/evosuite/releases/download/v1.2.0/evosuite-standalone-runtime-1.2.0.jar"

          Invoke-WebRequest `
            -Uri $runtimeUrl `
            -OutFile $runtimeJar

          if (-not (Test-Path $runtimeJar)) {
            throw "EvoSuite 1.2.0 standalone runtime was not downloaded."
          }

          Write-Host "Resolved dependency jars:"

          Get-ChildItem `
            $depsDir `
            -Filter "*.jar" |
          Sort-Object Name |
          Select-Object -ExpandProperty Name

      - name: Compile frozen EvoSuite T_ES suites
        shell: pwsh
        run: |
          $testing = Join-Path $env:GITHUB_WORKSPACE "isw2\testing"

          $depsDir = Join-Path $testing "target\ci-evosuite-deps"
          $outDir = Join-Path $testing "target\ci-evosuite-test-classes"

          $sources = @(

            # PCEnhancer T_ES
            (Join-Path $testing "src\test\java\org\apache\openjpa\enhance\PCEnhancerTestAccess.java"),
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\pcenhancer\es\PCEnhancerEvoSuiteSeed0Scaffolding.java"),
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\pcenhancer\es\PCEnhancerEvoSuiteSeed0Test.java"),
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\pcenhancer\es\PCEnhancerEvoSuiteSeed1Scaffolding.java"),
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\pcenhancer\es\PCEnhancerEvoSuiteSeed1Test.java"),

            # ListIteratorWrapper T_ES
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\listiteratorwrapper\es\ListIteratorWrapperEvoSuiteSeed0Scaffolding.java"),
            (Join-Path $testing "src\test\java\it\uniroma2\isw2\openjpa\testing\listiteratorwrapper\es\ListIteratorWrapperEvoSuiteSeed0Test.java")
          )

          foreach ($source in $sources) {
            if (-not (Test-Path $source)) {
              throw "Frozen EvoSuite source not found: $source"
            }
          }

          $javacArgs = @(
            "--release", "11",
            "-encoding", "UTF-8",
            "-cp", "$depsDir\*",
            "-d", $outDir
          ) + $sources

          & javac @javacArgs

          if ($LASTEXITCODE -ne 0) {
            throw "Compilation of frozen EvoSuite T_ES suites failed."
          }

          Write-Host "Frozen EvoSuite compilation: PASS"

      - name: Run frozen PCEnhancer T_ES
        shell: pwsh
        run: |
          $testing = Join-Path $env:GITHUB_WORKSPACE "isw2\testing"

          $depsDir = Join-Path $testing "target\ci-evosuite-deps"
          $outDir = Join-Path $testing "target\ci-evosuite-test-classes"

          $runtimeCp = "$outDir;$depsDir\*"

          $output = & java `
            -cp $runtimeCp `
            org.junit.runner.JUnitCore `
            it.uniroma2.isw2.openjpa.testing.pcenhancer.es.PCEnhancerEvoSuiteSeed0Test `
            it.uniroma2.isw2.openjpa.testing.pcenhancer.es.PCEnhancerEvoSuiteSeed1Test `
            2>&1

          $exitCode = $LASTEXITCODE

          $output |
            ForEach-Object {
              Write-Host $_
            }

          if ($exitCode -ne 0) {
            throw "Frozen PCEnhancer T_ES failed."
          }

          $text = $output -join "`n"

          if ($text -notmatch "OK \(30 tests\)") {
            throw "PCEnhancer T_ES finished without expected result OK (30 tests)."
          }

          Write-Host ""
          Write-Host "Frozen PCEnhancer T_ES: 30/30 PASS."

      - name: Run frozen ListIteratorWrapper T_ES
        shell: pwsh
        run: |
          $testing = Join-Path $env:GITHUB_WORKSPACE "isw2\testing"

          $depsDir = Join-Path $testing "target\ci-evosuite-deps"
          $outDir = Join-Path $testing "target\ci-evosuite-test-classes"

          $runtimeCp = "$outDir;$depsDir\*"

          $oldJdkJavaOptions = $env:JDK_JAVA_OPTIONS

          $env:JDK_JAVA_OPTIONS = `
            "--add-opens=java.desktop/java.awt=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED"

          try {

            $output = & java `
              -cp $runtimeCp `
              org.junit.runner.JUnitCore `
              it.uniroma2.isw2.openjpa.testing.listiteratorwrapper.es.ListIteratorWrapperEvoSuiteSeed0Test `
              2>&1

            $exitCode = $LASTEXITCODE
          }
          finally {
            $env:JDK_JAVA_OPTIONS = $oldJdkJavaOptions
          }

          $output |
            ForEach-Object {
              Write-Host $_
            }

          if ($exitCode -ne 0) {
            throw "Frozen ListIteratorWrapper T_ES failed."
          }

          $text = $output -join "`n"

          if ($text -notmatch "OK \(12 tests\)") {
            throw "ListIteratorWrapper T_ES finished without expected result OK (12 tests)."
          }

          Write-Host ""
          Write-Host "Frozen ListIteratorWrapper T_ES: 12/12 PASS."
